<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Audivo Mini</title></head><body><header><strong>Audivo</strong><span>Mini</span><button id="installBtn" hidden>Instalar</button></header><main><section class="hero"><h1>Seu áudio, sem depender da tela.</h1><p>Cole um link do YouTube, baixe o áudio e escute com a tela bloqueada. A biblioteca fica no aparelho.</p><form id="importForm"><input id="urlInput" type="url" placeholder="https://youtube.com/watch?v=..." required><button id="importBtn">Adicionar</button></form><div id="status" role="status"></div></section><section><div class="head"><h2>Biblioteca</h2><button id="clearBtn">Limpar</button></div><div id="library"></div></section></main><footer id="player" hidden><div class="now"><img id="cover" alt=""><div><b id="nowTitle">—</b><small id="nowMeta">Biblioteca local</small></div></div><div class="controls"><button id="backBtn">↶15</button><button id="playBtn" class="play">▶</button><button id="forwardBtn">30↷</button></div><input id="seek" type="range" min="0" max="100" value="0"><div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div><audio id="audio" preload="metadata"></audio></footer><script src="app.js"></script></body></html>
